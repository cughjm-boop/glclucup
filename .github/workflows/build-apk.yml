name: Build Android APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build APK (Performance Optimized)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Install dependencies
        run: npm ci

      - name: Build web app (production optimized)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Verify hardware acceleration
        run: |
          if grep -q "android:hardwareAccelerated" android/app/src/main/AndroidManifest.xml; then
            echo "✓ Hardware acceleration enabled"
          else
            echo "⚠ Warning: hardwareAccelerated not found in AndroidManifest.xml"
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Chat-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          compression-level: 6

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 性能优化版 APK

            ### 优化内容
            - ✅ Android WebView 硬件加速
            - ✅ 虚拟滚动 - 消息按 20 条分页加载
            - ✅ React.memo 优化组件渲染
            - ✅ 生产构建移除 console.log
            - ✅ 视口高度修复 (dvh + visualViewport)
            - ✅ @capacitor/keyboard 键盘适配
            - ✅ 代码分割 (vendor/state 分离)
            - ✅ https scheme 避免混合内容
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ APK 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 下载 APK: 点击上方的 **Artifacts** → **AI-Chat-APK-Debug**" >> $GITHUB_STEP_SUMMARY
          echo "📦 APK 路径: \`android/app/build/outputs/apk/debug/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 性能优化" >> $GITHUB_STEP_SUMMARY
          echo "- 硬件加速: 已启用" >> $GITHUB_STEP_SUMMARY
          echo "- 虚拟滚动: 20条/页" >> $GITHUB_STEP_SUMMARY
          echo "- 代码分割: vendor + state 分离" >> $GITHUB_STEP_SUMMARY
          echo "- console.log: 已移除" >> $GITHUB_STEP_SUMMARY